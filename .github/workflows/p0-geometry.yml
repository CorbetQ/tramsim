name: P0 Geometry audit
on:
  pull_request:
    paths: ['tools/qa/geometry_audit.py', 'tools/qa/export_geometry_obstacles.gd', 'tests/test_geometry_audit.py', 'data/free/**', 'data/networks/**', '.github/workflows/p0-geometry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic collisions, ramps, curves, sources and regression gate
        run: python -m unittest discover -s tests -p test_geometry_audit.py
      - name: Record all existing graph findings (no clean-geometry claim)
        run: |
          python tools/qa/geometry_audit.py data/networks/*.json data/free/*.json --verify-osm --report-only --output .cache/geometry.json
          python - <<'PY'
          import json,os
          result=json.load(open('.cache/geometry.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Existing geometry findings (unresolved, no map modification): '+str(result['summary'])+'\n')
          PY
      - name: Gate regressions against the committed full baseline
        run: python tools/qa/geometry_audit.py data/networks/*.json data/free/*.json --verify-osm --baseline docs/p0/geometry-baseline.json.gz --output .cache/geometry-delta.json
      - name: Godot 4.6.3 and actual rendered structures
        run: |
          curl --fail -L -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --import
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --headless --path . -s tools/qa/export_geometry_obstacles.gd -- res://data/free/nantes.json res://.cache/nantes-obstacles.json
          python tools/qa/geometry_audit.py data/free/nantes.json --plan data/rolling_stock/plans/citadis_302.json --obstacles .cache/nantes-obstacles.json --report-only --output .cache/nantes-swept.json
