name: release
# Compile l'APK Android et l'EXE Windows puis les publie dans une Release GitHub.
on:
  push:
    branches: [main, master, "ccr-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      audio_studio_release:
        description: Publier les binaires Audio Studio déjà compilés et validés par la CI audio
        type: boolean
        default: false
      rolling_stock_preview:
        description: Construire et déposer uniquement l’aperçu des rames dans sa release en brouillon
        type: boolean
        default: false
      skip_tests:
        description: Aperçu d'avancement (travail en cours) sans les tests longs
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  stock_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.rolling_stock_preview
    uses: ./.github/workflows/stock-preview.yml
  build:
    if: github.event_name != 'workflow_dispatch' || (!inputs.rolling_stock_preview && !inputs.audio_studio_release)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Version du jeu
        run: |
          python - <<'PYVERSION' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          version = re.search(r'config/version="([0-9.]+)"', Path('project.godot').read_text()).group(1)
          print('APP_VERSION=' + version)
          PYVERSION
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: SDK Android (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          SDKM=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM "platform-tools" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Godot et modèles d'export
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          curl -sSL -o tpl.tpz https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Clé de développement et réglages d'export
        run: |
          keytool -genkeypair -keystore $HOME/dev.keystore -alias dev -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tramsim-dev -keypass tramsim-dev -dname "CN=TramSim Dev"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/dev.keystore"
          export/android/debug_keystore_user = "dev"
          export/android/debug_keystore_pass = "tramsim-dev"
          CFG
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dépendances des contrôles géographiques
        run: python -m pip install -r tools/import/requirements.txt
      - name: Tests
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-utils ffmpeg
          GODOT=$PWD/godot tests/run_all.sh
      - name: Export
        run: |
          mkdir -p build
          ./godot --headless --path . --import >/dev/null 2>&1 || true
          ./godot --headless --path . --export-debug Android build/TramSimFrance.apk
          mkdir -p build/win-x64 build/win-arm64
          ./godot --headless --path . --export-release Windows build/win-x64/TramSimFrance.exe
          ./godot --headless --path . --export-release "Windows ARM64" build/win-arm64/TramSimFrance.exe
          for a in x64 arm64; do cp CREDITS.md README.md build/win-$a/ ; (cd build/win-$a && zip -9 -r ../TramSimFrance-windows-$a.zip .); done
          for i in 1 2 3; do sudo apt-get update > /dev/null 2>&1; sudo apt-get install -y wixl > /dev/null 2>&1 && break; sleep 20; done
          if command -v wixl > /dev/null; then
            wixl -a x64 -D Version=${{ env.APP_VERSION }} -D SrcDir=build/win-x64 -o build/TramSimFrance.msi installer/tramsim.wxs
            # wixl ne connaît pas arm64 : MSI de plateforme x64 (installable sur Windows ARM) contenant l'exécutable ARM64 natif
            wixl -a x64 -D Version=${{ env.APP_VERSION }} -D SrcDir=build/win-arm64 -o build/TramSimFrance-arm64.msi installer/tramsim.wxs
          else
            echo "::warning::wixl indisponible : MSI non produit"
          fi
          ls -la build
      - name: APK de prévisualisation
        uses: actions/upload-artifact@v4
        with:
          name: TramSimFrance-Android
          path: build/TramSimFrance.apk
          retention-days: 14
      - name: EXE de prévisualisation
        uses: actions/upload-artifact@v4
        with:
          name: TramSimFrance-Windows
          path: build/win-x64/
          retention-days: 14
      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: Tram Sim France ${{ env.APP_VERSION }} (build ${{ github.run_number }})${{ (github.event_name == 'workflow_dispatch' && inputs.skip_tests) && ' — aperçu travail en cours' || '' }}
          prerelease: true
          fail_on_unmatched_files: false
          body: |
            - **Android** : TramSimFrance.apk (arm64, signature de développement : autoriser les sources inconnues).
            - **Windows x64** : TramSimFrance.msi (installeur) ou TramSimFrance-windows-x64.zip (portable : extraire puis lancer TramSimFrance.exe).
            - **Windows ARM64** (Snapdragon, Surface Pro X…) : TramSimFrance-arm64.msi ou TramSimFrance-windows-arm64.zip.
            - Application non signée : si SmartScreen affiche « Windows a protégé votre ordinateur », cliquer « Informations complémentaires » puis « Exécuter quand même ». Pour un zip, clic droit → Propriétés → cocher « Débloquer » avant d'extraire.
            Données : voies et quais OpenStreetMap (ODbL), GTFS des réseaux (transport.data.gouv.fr) et BD TOPO® IGN — voir CREDITS.md et docs/COUVERTURE.md.
          files: |
            build/TramSimFrance.apk
            build/TramSimFrance.msi
            build/TramSimFrance-arm64.msi
            build/TramSimFrance-windows-x64.zip
            build/TramSimFrance-windows-arm64.zip

  audio_studio_release:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_studio_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AUDIO_SOURCE_SHA: 3500c295d356c3cc1e057829715f114b0a0864b0
    steps:
      - name: Vérifier la provenance et les résultats audio/compilation
        run: |
          for run_id in 43660157830 43660157834; do
            actual=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha + " " + .conclusion')
            test "$actual" = "$AUDIO_SOURCE_SHA success"
          done
      - uses: actions/checkout@v4
        with:
          ref: 3500c295d356c3cc1e057829715f114b0a0864b0
      - name: APK compilé
        uses: actions/download-artifact@v4
        with:
          name: TramSimFrance-Android
          path: build/android
          run-id: 43660157830
          github-token: ${{ github.token }}
      - name: EXE compilé et données Windows
        uses: actions/download-artifact@v4
        with:
          name: TramSimFrance-Windows
          path: build/windows-x64
          run-id: 43660157830
          github-token: ${{ github.token }}
      - name: Préparer et vérifier les archives publiables
        run: |
          test -s build/android/TramSimFrance.apk
          test -s build/windows-x64/TramSimFrance.exe
          mkdir -p build/release
          cp build/android/TramSimFrance.apk build/release/TramSimFrance-AudioStudio.apk
          (cd build/windows-x64 && zip -q -r ../release/TramSimFrance-AudioStudio-windows-x64.zip .)
          zip -q -r build/release/TramSim-Audio-Studio-demos.zip docs/audio-studio -x '*.import'
          unzip -tq build/release/TramSimFrance-AudioStudio-windows-x64.zip
          unzip -tq build/release/TramSim-Audio-Studio-demos.zip
          unzip -tq build/release/TramSimFrance-AudioStudio.apk
          (cd build/release && sha256sum *.apk *.zip > SHA256SUMS.txt)
      - name: Publier la préversion Audio Studio
        run: |
          cat > build/release-notes.md <<'NOTES'
          ## TramSim Audio Studio — préversion de test

          - **Android** : `TramSimFrance-AudioStudio.apk`.
          - **Windows x64** : extraire `TramSimFrance-AudioStudio-windows-x64.zip`, puis lancer `TramSimFrance.exe`. Conserver tous les fichiers extraits avec l'EXE.
          - **Écoute A/B** : extraire `TramSim-Audio-Studio-demos.zip`, puis ouvrir `docs/audio-studio/demos/index.html`. Cinq véritables captures Godot, attributions et rapport inclus.
          - `SHA256SUMS.txt` contient les empreintes des fichiers téléchargés.

          Binaires issus du commit `3500c295d356c3cc1e057829715f114b0a0864b0`, compilés par le run 43660157830. CI audio réussie : run 43660157834 (26 tests Python et suites Godot, dont les 76 variantes). Aucun nouveau téléchargement de modèle ni traitement IA pendant le jeu.

          **Limites de cette préversion** : la suite globale du run 43660157836 a échoué, notamment sur un contrôle géographique d'Angers et des tests cherchant le binaire Godot dans le PATH. Les contrôles audio autonomes et la compilation ont réussi ; cette publication ne prétend pas que toute la CI est verte. Le 305 reste modélisé, le candidat 302 de Moscou n'est pas activé par défaut et aucune audition humaine n'est revendiquée. Les nouvelles signatures ne remplacent pas automatiquement les banques approuvées.

          Application de développement non signée par un certificat de distribution. Aucune fusion automatique : PR #12 toujours ouverte. Sources, licences, provenance et limites détaillées dans `docs/audio-studio/REPORT.md` et `CREDITS.md`.
          NOTES
          gh release create v0.13.1-audio-studio.1 build/release/*             --target "$AUDIO_SOURCE_SHA" --prerelease             --title 'Tram Sim France 0.13.1 — Audio Studio (préversion)'             --notes-file build/release-notes.md
