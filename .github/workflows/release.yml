name: release
# Compile l'APK Android et l'EXE Windows puis les publie dans une Release GitHub.
on:
  push:
    branches: [main, master, "ccr-*"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Compiler uniquement les versions Windows (x64 et ARM64)
        type: boolean
        default: false
      rolling_stock_preview:
        description: Construire et déposer uniquement l’aperçu des rames dans sa release en brouillon
        type: boolean
        default: false
      skip_tests:
        description: Aperçu d'avancement (travail en cours) sans les tests longs
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  stock_preview:
    if: github.event_name == 'workflow_dispatch' && inputs.rolling_stock_preview
    uses: ./.github/workflows/stock-preview.yml
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.rolling_stock_preview
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    env:
      GODOT_VERSION: 4.6.3
      WINDOWS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Version du jeu
        id: version
        run: |
          python - <<'PYVERSION'
          import os, re
          from pathlib import Path
          version = re.search(r'config/version="([0-9.]+)"', Path('project.godot').read_text()).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('APP_VERSION=' + version + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('version=' + version + '\n')
          PYVERSION
      - uses: actions/setup-java@v4
        if: env.WINDOWS_ONLY != 'true'
        with: {distribution: temurin, java-version: "21"}
      - name: SDK Android (préinstallé sur le runner)
        if: env.WINDOWS_ONLY != 'true'
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          SDKM=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM "platform-tools" "build-tools;36.0.0" "platforms;android-36" > /dev/null
      - name: Godot et modèles d'export
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && chmod +x godot
          if [ "$WINDOWS_ONLY" != "true" ]; then
            curl -sSL -o tpl.tpz https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            unzip -q tpl.tpz && mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          fi
      - name: Clé de développement et réglages d'export
        if: env.WINDOWS_ONLY != 'true'
        run: |
          keytool -genkeypair -keystore $HOME/dev.keystore -alias dev -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tramsim-dev -keypass tramsim-dev -dname "CN=TramSim Dev"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/dev.keystore"
          export/android/debug_keystore_user = "dev"
          export/android/debug_keystore_pass = "tramsim-dev"
          CFG
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Dépendances des contrôles géographiques
        if: env.WINDOWS_ONLY != 'true'
        run: python -m pip install -r tools/import/requirements.txt
      - name: Tests
        if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.skip_tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-utils ffmpeg
          # outils d'assets (gltfpack, toktx, Blender) : workflow séparé asset-tools.yml (n'allonge pas ce build)
          GODOT=$PWD/godot tests/run_all.sh
      - name: Stamp benchmark build identity
        run: python tools/perf/write_build_info.py
      - name: Mandatory Windows packaging tests
        run: python -m unittest discover -s tests -p test_windows_packaging.py
      - name: Export
        run: |
          set -euo pipefail
          mkdir -p build/win-x64 build/win-arm64
          if [ "$WINDOWS_ONLY" = "true" ]; then python tools/models/stock/prepare_pc_imports.py; fi
          ./godot --headless --editor --path . --import > build/import.log 2>&1
          ! grep -Eq 'SCRIPT ERROR|Parse Error' build/import.log
          export_all() {
            if [ "$WINDOWS_ONLY" != "true" ]; then
              ./godot --headless --path . --export-debug Android build/TramSimFrance.apk 2>&1 | tee -a build/export.log || return 1
              test -s build/TramSimFrance.apk || return 1
            fi
            ./godot --headless --path . --export-pack Windows build/win-x64/TramSimFrance.pck 2>&1 | tee -a build/export.log &&
            ./godot --headless --path . --export-pack "Windows ARM64" build/win-arm64/TramSimFrance.pck 2>&1 | tee -a build/export.log &&
            test -s build/win-x64/TramSimFrance.pck && test -s build/win-arm64/TramSimFrance.pck
          }
          if ! export_all; then
            echo "::warning::Shader baking failed: retrying without shader baker"
            sed -i 's#^shader_baker/enabled=true#shader_baker/enabled=false#' export_presets.cfg
            export_all
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-export-x64
          path: build/win-x64/
          retention-days: 2
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-export-arm64
          path: build/win-arm64/
          retention-days: 2
          if-no-files-found: error
      - name: APK de prévisualisation
        if: env.WINDOWS_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TramSimFrance-Android
          path: build/TramSimFrance.apk
          retention-days: 14
          if-no-files-found: error
      - name: Export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-logs
          path: build/*.log

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-export-${{ matrix.arch }}
          path: build/win-${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Prepare original signed upstream runtime
        run: |
          New-Item -ItemType Directory -Force reports, dist | Out-Null
          python tools/windows/prepare_runtime.py --arch ${{ matrix.arch }} --destination build/win-${{ matrix.arch }} --cache "$env:RUNNER_TEMP/godot-runtime" --godot-version 4.6.3
          if ($LASTEXITCODE -ne 0) { throw 'Runtime preparation failed' }
          ./tools/windows/verify_runtime.ps1 -Directory build/win-${{ matrix.arch }} -Architecture ${{ matrix.arch }} -Report reports/runtime-signature.json
      - name: Build native MSI
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          python tools/windows/build_installer.py --source build/win-${{ matrix.arch }} --arch ${{ matrix.arch }} --version ${{ needs.build.outputs.app_version }} --output build/TramSim-${{ matrix.arch }}.wxs
          if ($LASTEXITCODE -ne 0) { throw 'MSI authoring failed' }
          & "$env:RUNNER_TEMP/wix/wix.exe" build -arch ${{ matrix.arch }} -o dist/TramSimFrance-${{ matrix.arch }}.msi build/TramSim-${{ matrix.arch }}.wxs
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI build failed' }
      - name: Optional project MSI signature
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: ./tools/windows/sign_installer.ps1 -Msi dist/TramSimFrance-${{ matrix.arch }}.msi -Report reports/msi-signature.json
      - name: Native install, boot, reinstall and uninstall
        run: ./tools/windows/test_package.ps1 -Directory build/win-${{ matrix.arch }} -Msi dist/TramSimFrance-${{ matrix.arch }}.msi -Architecture ${{ matrix.arch }} -Reports reports
      - name: Package verified portable build
        run: |
          Compress-Archive -Path build/win-${{ matrix.arch }}/* -DestinationPath dist/TramSimFrance-windows-${{ matrix.arch }}.zip
          Copy-Item reports/package-validation.json dist/Windows-validation-${{ matrix.arch }}.json
          Copy-Item reports/msi-signature.json dist/MSI-signature-${{ matrix.arch }}.json
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content dist/SHA256SUMS-${{ matrix.arch }}.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validated-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Windows diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics-${{ matrix.arch }}
          path: |
            reports/
            build/*.wxs
          retention-days: 14

  publish:
    needs: [build, windows]
    if: github.event_name != 'pull_request' && needs.build.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-validated-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
        with:
          name: TramSimFrance-Android
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v${{ needs.build.outputs.app_version }}-build.${{ github.run_number }}
          name: Tram Sim France ${{ needs.build.outputs.app_version }} (build ${{ github.run_number }})
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Correctif Windows : moteur Godot officiel conservant sa signature Authenticode, données du jeu dans un PCK séparé.
            - **Snapdragon / Windows ARM64** : `TramSimFrance-windows-arm64.zip` (portable) ou `TramSimFrance-arm64.msi` (installeur ARM64 natif).
            - **Intel / AMD x64** : `TramSimFrance-windows-x64.zip` ou `TramSimFrance-x64.msi`.
            - Extraire tout le ZIP et ouvrir `TramSimFrance.exe`, en gardant le PCK à côté.
            - Tests natifs Windows : lancement du vrai jeu, signature du moteur, installation, réinstallation, désinstallation. Rapports JSON et empreintes SHA-256 joints.
            - Le moteur est signé par son éditeur Godot ; le MSI reste non signé si aucun certificat de projet n’est configuré (voir `MSI-signature-*.json`). Ne pas désactiver les protections Windows. Le ZIP portable est disponible si votre politique refuse le MSI.
            - Le MSI installe pour le compte courant. Les sauvegardes sont conservées dans AppData.
            Les données et leurs licences sont décrites dans le fichier CREDITS.md inclus.
          files: dist/*
