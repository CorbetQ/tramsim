name: tests
on: [pull_request]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.6.3
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q g.zip && chmod +x Godot_v4.6.3-stable_linux.x86_64
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r tools/import/requirements.txt
      - run: sudo apt-get install -y xvfb > /dev/null 2>&1 || true
      - run: GODOT=$PWD/Godot_v4.6.3-stable_linux.x86_64 tests/run_all.sh
